<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font:15px "Segoe UI",system-ui,sans-serif;background:linear-gradient(130deg,#c4005f,#e5006e 40%,#ff5a2a 75%,#ff9d00);color:#33102a}
form{background:#fff;border-radius:20px;padding:34px;width:min(400px,100%);box-shadow:0 30px 60px #7a0a4a66}h2{margin:0 0 4px;color:#b0005a}p{margin:0 0 18px;color:#7a6270}label{font-weight:700;font-size:13px}
input{width:100%;padding:13px;border:1.5px solid #f1d3df;border-radius:10px;font:inherit;margin:4px 0 14px}button{width:100%;background:#d6006f;color:#fff;border:0;border-radius:10px;padding:14px;font:700 15px inherit;cursor:pointer}a{color:#d6006f;display:block;text-align:center;margin-top:14px;font-weight:600}#m{color:#c0392b;font-weight:600;margin-top:12px;text-align:center}</style></head><body>
<form id="f"><h2>Saagee Ads Admin</h2><p>Login to edit your website</p><label>Email</label><input id="e" type="email" required autocomplete="username"><label>Password</label><input id="p" type="password" required autocomplete="current-password"><button>Login &amp; Edit Website</button><a href="#" id="r">Forgot password?</a><div id="m"></div></form>
<script type="module">
import {firebaseConfig as c} from './firebase-config.js';
const B='https://www.gstatic.com/firebasejs/10.12.2/';
const {initializeApp}=await import(B+'firebase-app.js');
const {getAuth,signInWithEmailAndPassword,onAuthStateChanged,sendPasswordResetEmail}=await import(B+'firebase-auth.js');
const auth=getAuth(initializeApp(c)),$=s=>document.querySelector(s),go=()=>location.href='index.html?edit=1',msg=t=>$('#m').textContent=t;
onAuthStateChanged(auth,u=>{if(u)go()});
$('#f').onsubmit=async e=>{e.preventDefault();msg('Logging in...');try{await signInWithEmailAndPassword(auth,$('#e').value,$('#p').value);go()}catch{msg('Login failed. Check your email and password.')}};
$('#r').onclick=async e=>{e.preventDefault();if(!$('#e').value)return msg('Type your email first');try{await sendPasswordResetEmail(auth,$('#e').value);msg('Password reset link sent to your email')}catch{msg('Could not send reset link')}};
</script></body></html>
