<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin – Saagee Ads</title>
<style>
:root{--pk:#d6006f;--or:#ff7a00;--yl:#ffc400;--tx:#33102a;--bd:#f1d3df}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:#fff7ee;color:var(--tx)}
header{background:linear-gradient(90deg,var(--pk),var(--or));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
main{max-width:1000px;margin:20px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px #d6006f1a;margin-bottom:18px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:9px;font:inherit;margin:4px 0 12px;background:#fff}label{font-weight:700;font-size:13px}
button{background:var(--pk);color:#fff;border:0;border-radius:9px;padding:11px 20px;font:700 14px inherit;cursor:pointer}button:disabled{opacity:.5}button.s{background:#fff;color:var(--pk);border:1.5px solid var(--pk);padding:6px 12px}button.d{color:#c0392b;border-color:#c0392b}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#fff;color:var(--tx);border:1.5px solid var(--bd)}.tabs button.on{background:var(--yl);border-color:var(--yl)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.it{border:1.5px solid var(--bd);border-radius:12px;padding:10px}.it img{width:100%;height:120px;object-fit:contain;background:#fafafa;border-radius:8px}.it p{margin:6px 0;font-weight:700;font-size:13px;word-break:break-word}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:9}.r2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:600px){.r2{grid-template-columns:1fr}}
</style></head><body>
<div id="login" style="display:none;max-width:380px;margin:90px auto;padding:0 16px"><div class="card"><h2 style="margin-top:0">Admin Login</h2><form id="lf"><label>Email</label><input id="em" type="email" required><label>Password</label><input id="pw" type="password" required><button style="width:100%">Login</button></form><p style="text-align:center"><a href="#" id="fp" style="color:var(--pk)">Forgot password?</a></p></div></div>
<div id="app" style="display:none"><header><span>Saagee Ads · Admin</span><button class="s" id="lo">Logout</button></header><main><div class="tabs"><button data-t="works">Work Photos</button><button data-t="clients">Client Logos</button><button data-t="reviews">Reviews</button><button data-t="settings">Site Settings</button></div><div id="p"></div></main></div><div id="msg"></div>
<script type="module">
import {firebaseConfig as cfg} from './firebase-config.js';
const B='https://www.gstatic.com/firebasejs/10.12.2/';
const {initializeApp}=await import(B+'firebase-app.js');
const {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail}=await import(B+'firebase-auth.js');
const {getFirestore,collection,doc,setDoc,getDoc,getDocs,addDoc,deleteDoc,updateDoc,query,orderBy}=await import(B+'firebase-firestore.js');
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const msg=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',3000)};
const shrink=(file,max,q,type='image/jpeg')=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),w=Math.round(i.width*s),h=Math.round(i.height*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(i,0,0,w,h);let d=c.toDataURL(type,q);while(d.length>850000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};i.onerror=()=>rej(new Error('Not an image'));i.src=r.result};r.readAsDataURL(file)});
const list=async n=>(await getDocs(query(collection(db,n),orderBy('createdAt','desc')))).docs.map(d=>({id:d.id,...d.data()}));
$('#lf').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch{msg('Login failed. Check email and password.')}};
$('#fp').onclick=async e=>{e.preventDefault();const m=$('#em').value;if(!m)return msg('Type your email first');try{await sendPasswordResetEmail(auth,m);msg('Password reset link sent')}catch{msg('Could not send reset link')}};
$('#lo').onclick=()=>signOut(auth);
const T={works,clients,reviews,settings};
function tab(n){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));T[n]().catch(x=>msg('Error: '+x.message))}
document.querySelector('.tabs').onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t)};
onAuthStateChanged(auth,u=>{$('#login').style.display=u?'none':'block';$('#app').style.display=u?'block':'none';if(u)tab('works')});
async function works(){const cats=['Flex','Hoardings','Bus Ads','Wall Painting','Shop Boards','Backlit Boards','Newspaper Ads','Visiting Cards','Other'];
$('#p').innerHTML=`<div class="card"><h3 style="margin-top:0">Add work photos</h3><div class="r2"><div><label>Title</label><input id="t" placeholder="e.g. Jewellery shop flex"></div><div><label>Category</label><select id="c">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div></div><label>Photos (you can select many)</label><input id="f" type="file" accept="image/*" multiple><button id="up">Upload</button></div><div class="card"><h3 style="margin-top:0">Your works</h3><div class="g" id="l">Loading...</div></div>`;
$('#up').onclick=async()=>{const fs=[...$('#f').files];if(!fs.length)return msg('Choose photos first');$('#up').disabled=true;let i=0;for(const f of fs){msg(`Uploading ${++i}/${fs.length}...`);try{const thumb=await shrink(f,520,.75),full=await shrink(f,1400,.82),r=await addDoc(collection(db,'works'),{title:$('#t').value.trim(),category:$('#c').value,thumb,createdAt:Date.now()});await setDoc(doc(db,'workFull',r.id),{full})}catch(x){msg('Failed: '+x.message);break}}msg('Upload finished');works()};
const l=await list('works');$('#l').innerHTML=l.map(w=>`<div class="it"><img src="${w.thumb}"><p>${E(w.title)||'(no title)'}<br><small>${E(w.category)}</small></p><button class="s" data-r="${w.id}">Rename</button> <button class="s d" data-x="${w.id}">Delete</button></div>`).join('')||'No photos yet';
$('#l').onclick=async e=>{const r=e.target.dataset.r,x=e.target.dataset.x;if(r){const t=prompt('New title');if(t!==null){await updateDoc(doc(db,'works',r),{title:t});works()}}if(x&&confirm('Delete this photo?')){await deleteDoc(doc(db,'works',x));await deleteDoc(doc(db,'workFull',x));works()}}}
async function clients(){$('#p').innerHTML=`<div class="card"><h3 style="margin-top:0">Add client logo</h3><label>Client name</label><input id="n"><label>Logo image (PNG with transparent background looks best)</label><input id="f" type="file" accept="image/*"><button id="up">Upload</button></div><div class="card"><h3 style="margin-top:0">Clients</h3><div class="g" id="l">Loading...</div></div>`;
$('#up').onclick=async()=>{const f=$('#f').files[0];if(!f)return msg('Choose a logo first');try{const logo=await shrink(f,420,.9,'image/png');await addDoc(collection(db,'clients'),{name:$('#n').value.trim(),logo,createdAt:Date.now()});msg('Added');clients()}catch(x){msg('Failed: '+x.message)}};
const l=await list('clients');$('#l').innerHTML=l.map(c=>`<div class="it"><img src="${c.logo}"><p>${E(c.name)}</p><button class="s d" data-x="${c.id}">Delete</button></div>`).join('')||'No clients yet';
$('#l').onclick=async e=>{const x=e.target.dataset.x;if(x&&confirm('Delete this client?')){await deleteDoc(doc(db,'clients',x));clients()}}}
async function reviews(){$('#p').innerHTML=`<div class="card"><h3 style="margin-top:0">Add customer review</h3><div class="r2"><div><label>Name</label><input id="n"></div><div><label>Company / role</label><input id="co"></div></div><label>Rating</label><select id="rt"><option>5</option><option>4</option><option>3</option></select><label>Review</label><textarea id="tx" rows="3"></textarea><button id="up">Add review</button></div><div class="card"><h3 style="margin-top:0">Reviews</h3><div id="l">Loading...</div></div>`;
$('#up').onclick=async()=>{if(!$('#n').value.trim()||!$('#tx').value.trim())return msg('Name and review are required');await addDoc(collection(db,'reviews'),{name:$('#n').value.trim(),company:$('#co').value.trim(),rating:+$('#rt').value,text:$('#tx').value.trim(),createdAt:Date.now()});msg('Added');reviews()};
const l=await list('reviews');$('#l').innerHTML=l.map(r=>`<div class="it" style="margin-bottom:10px"><p>${'★'.repeat(r.rating)} ${E(r.name)} <small>${E(r.company)}</small></p><div>${E(r.text)}</div><button class="s d" data-x="${r.id}">Delete</button></div>`).join('')||'No reviews yet';
$('#l').onclick=async e=>{const x=e.target.dataset.x;if(x&&confirm('Delete this review?')){await deleteDoc(doc(db,'reviews',x));reviews()}}}
const F=[['heroTitle','Hero headline (put [[ ]] around highlighted words)'],['heroText','Hero paragraph','t'],['aboutText','About text (blank line between paragraphs)','t'],['stat1n','Stat 1 number (e.g. 15+)'],['stat1l','Stat 1 label'],['stat2n','Stat 2 number'],['stat2l','Stat 2 label'],['stat3n','Stat 3 number'],['stat3l','Stat 3 label'],['phone1','Phone 1 (e.g. +91 90922 17774)'],['phone2','Phone 2 (e.g. 04323-222399)'],['whatsapp','WhatsApp number, digits only with country code (e.g. 919092217774)'],['email','Email'],['address','Address'],['mapsLink','Google Maps link'],['instagram','Instagram link'],['facebook','Facebook link'],['youtube','YouTube link'],['areas','Areas we serve (comma separated)','t'],['services','Services (one per line: Name | short description)','t'],['faq','FAQ (question on first line, answer below it, blank line between items)','t']];
async function settings(){const s=(await getDoc(doc(db,'settings','site'))).data()||{};
$('#p').innerHTML=`<div class="card"><h3 style="margin-top:0">Site settings</h3><p>Leave a field empty to keep the default text on the website.</p>${F.map(([k,l,t])=>`<label>${l}</label>`+(t?`<textarea id="s_${k}" rows="5">${E(s[k])}</textarea>`:`<input id="s_${k}" value="${E(s[k])}">`)).join('')}<button id="sv">Save settings</button></div>`;
$('#sv').onclick=async()=>{const o={};F.forEach(([k])=>o[k]=$('#s_'+k).value.trim());await setDoc(doc(db,'settings','site'),o);msg('Saved. Refresh the website to see changes.')}}
</script></body></html>
